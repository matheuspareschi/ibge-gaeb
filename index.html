<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Levantamento GAEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6eee2; --card:rgba(255,253,249,.74); --card-line:rgba(255,255,255,.55); --ink:#2a2722; --muted:#5f594f; --line:#ddd2c2;
  --accent:#3f5a4a; --accent2:#6a8c76; --accent-ink:#fff; --soft:rgba(201,222,205,.9); --soft2:rgba(226,236,228,.5); --warn:#a4452c;
  --opt-bg:rgba(255,255,255,.55); --opt-line:#ddd2c2; --mk-line:#a99e8c; --mk-bg:#fff; --mk-in:#fff;
  --field-bg:rgba(255,255,255,.8); --field-line:#d8cdbd; --ghost-bg:rgba(255,255,255,.4); --track:rgba(63,90,74,.15);
  --bar-bg:rgba(246,238,226,.82); --shadow:rgba(63,90,74,.45);
  --serif:'Fraunces',Georgia,serif; --body:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  --g1:rgba(201,222,205,.85); --g2:rgba(246,205,176,.55); --g3:rgba(190,210,225,.6);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#2b2b30; --card:rgba(255,255,255,.07); --card-line:rgba(255,255,255,.13); --ink:#f2ede3; --muted:#bdb6a8; --line:rgba(255,255,255,.18);
    --accent:#a3c9af; --accent2:#7fa98b; --accent-ink:#10201a; --soft:rgba(163,201,175,.22); --soft2:rgba(163,201,175,.08); --warn:#f0a089;
    --opt-bg:rgba(255,255,255,.06); --opt-line:rgba(255,255,255,.24); --mk-line:#9d978a; --mk-bg:transparent; --mk-in:#2b2b30;
    --field-bg:rgba(255,255,255,.08); --field-line:rgba(255,255,255,.24); --ghost-bg:rgba(255,255,255,.07); --track:rgba(255,255,255,.14);
    --bar-bg:rgba(43,43,48,.82); --shadow:rgba(0,0,0,.35);
    --g1:rgba(110,150,130,.4); --g2:rgba(150,120,100,.3); --g3:rgba(100,125,160,.35);
  }
}
@property --g1{syntax:'<color>';inherits:true;initial-value:rgba(201,222,205,.85)}
@property --g2{syntax:'<color>';inherits:true;initial-value:rgba(246,205,176,.55)}
@property --g3{syntax:'<color>';inherits:true;initial-value:rgba(190,210,225,.6)}
@property --x1{syntax:'<percentage>';inherits:true;initial-value:100%}
@property --y1{syntax:'<percentage>';inherits:true;initial-value:0%}
@property --x2{syntax:'<percentage>';inherits:true;initial-value:0%}
@property --y2{syntax:'<percentage>';inherits:true;initial-value:65%}
@property --x3{syntax:'<percentage>';inherits:true;initial-value:100%}
@property --y3{syntax:'<percentage>';inherits:true;initial-value:100%}
html{transition:--g1 1.6s ease,--g2 1.6s ease,--g3 1.6s ease,--x1 1.6s ease,--y1 1.6s ease,--x2 1.6s ease,--y2 1.6s ease,--x3 1.6s ease,--y3 1.6s ease}
@media (prefers-reduced-motion:reduce){html{transition:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);min-height:100vh;background-color:var(--bg);
  background-image:radial-gradient(760px 560px at var(--x1) var(--y1),var(--g1),transparent 70%),radial-gradient(700px 560px at var(--x2) var(--y2),var(--g2),transparent 70%),radial-gradient(780px 600px at var(--x3) var(--y3),var(--g3),transparent 70%);
  background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto;padding:28px 32px 80px}
.bar{position:sticky;top:0;padding:14px 0 12px;z-index:5;margin-bottom:8px;background:var(--bar-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 100vmax var(--bar-bg);clip-path:inset(0 -100vmax)}
.bar .meta{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-bottom:8px}
.track{height:6px;background:var(--track);border-radius:6px;overflow:hidden}
.fill{height:100%;background-image:linear-gradient(90deg,#8fb59c,var(--accent));border-radius:6px;width:0;transition:width .4s}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
.kick{font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500}
.center{min-height:calc(100vh - 110px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
.center .in{max-width:760px;display:flex;flex-direction:column;gap:20px;align-items:center}
.center h1{font-size:clamp(44px,7vw,76px);line-height:1.04;letter-spacing:-.015em}
.pausa{font-family:var(--serif);font-style:italic;font-size:clamp(21px,2.4vw,28px);line-height:1.4;color:var(--muted);margin:0}
.big{font-family:var(--serif);font-size:clamp(23px,2.8vw,34px);line-height:1.4;margin:0}
.verso small{display:block;font-family:var(--body);font-size:17px;color:var(--muted);margin-top:12px}
.note{font-size:16.5px;color:var(--muted);background:var(--card);border:1px solid var(--card-line);border-radius:20px;padding:18px 24px;text-align:left;margin:0}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.dots i.on{width:26px;border-radius:8px;background-image:linear-gradient(90deg,#8fb59c,var(--accent))}
.field{width:100%;max-width:440px;text-align:left;display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--serif);font-size:21px}
.small{font-size:15px;color:var(--muted)}
.split{display:flex;flex-wrap:wrap;gap:36px 72px;align-items:flex-start}
.side{flex:0 1 320px;min-width:260px;position:sticky;top:90px;display:flex;flex-direction:column;gap:14px;padding-top:12px}
.side h2{font-size:clamp(34px,4vw,46px);line-height:1.08;letter-spacing:-.012em}
.side p{margin:0;font-family:var(--serif);font-size:18px;color:var(--muted);font-style:italic}
.qs{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.intro{background:var(--soft);border-radius:20px;padding:16px 20px;font-size:16.5px}
.q{background:var(--card);border:1px solid var(--card-line);border-radius:28px;padding:28px 28px 22px;box-shadow:0 24px 50px -30px var(--shadow)}
.q .tag{font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:8px}
.q p.t{font-family:var(--serif);font-size:clamp(20px,2.2vw,24px);line-height:1.3;margin:0 0 16px}
.scale{display:flex;flex-wrap:wrap;gap:10px}
.opts{display:flex;flex-direction:column;gap:10px}
label.o,button.sc{display:flex;align-items:center;gap:14px;border:1px solid var(--opt-line);background:var(--opt-bg);border-radius:16px;padding:12px 18px;cursor:pointer;font:inherit;font-size:17px;line-height:1.4;color:inherit;text-align:left;width:100%;min-height:54px}
button.sc{flex:1 1 90px;width:auto;justify-content:center;text-align:center;font-size:16px;padding:6px 8px;min-height:56px}
label.o:hover,button.sc:hover{border-color:var(--accent)}
label.o.on{border-color:var(--accent);background-image:linear-gradient(135deg,var(--soft),var(--soft2));box-shadow:0 8px 20px -14px var(--shadow)}
button.sc.on{border-color:var(--accent);color:var(--accent-ink);background-image:linear-gradient(135deg,var(--accent2),var(--accent))}
label.o input{position:absolute;opacity:0;pointer-events:none}
label.o .mk{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mk-line);background:var(--mk-bg);box-sizing:border-box}
label.o.m .mk{border-radius:6px}
label.o.on .mk{border:6px solid var(--accent);background:var(--mk-in)}
label.o.m.on .mk{border-width:5px}
label.o:focus-within,button.sc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.o.dim{opacity:.45;cursor:not-allowed}
.other{display:none;margin-top:10px}
.other.show{display:block}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;color:inherit;background:var(--field-bg);border:1px solid var(--field-line);border-radius:16px;padding:14px 18px;min-height:56px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:92px;resize:vertical}
details.cm{margin-top:16px}
details.cm summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none;color:var(--accent);font-size:15px;font-weight:500;padding:9px 16px;border:1px dashed var(--accent);border-radius:999px;background:var(--ghost-bg)}
details.cm summary::-webkit-details-marker{display:none}
details.cm summary::before{content:'+';font-size:18px;line-height:1;font-weight:500}
details.cm[open] summary::before{content:'\2212'}
details.cm summary:hover{background:var(--soft)}
details.cm summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.cm textarea{margin-top:10px}
.nav{display:flex;gap:14px;justify-content:center}
.nav.sp{justify-content:space-between}
button.btn{min-height:56px;padding:0 48px;border-radius:999px;border:0;color:var(--accent-ink);font-family:var(--serif);font-size:20px;font-weight:500;cursor:pointer;background-image:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 16px 30px -16px rgba(63,90,74,.8)}
button.btn.ghost{background:var(--ghost-bg);color:var(--accent);border:1px solid var(--accent);padding:0 28px;box-shadow:none;font-size:19px}
button.btn:disabled{opacity:.5;cursor:default}
button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.aviso{text-align:right;margin-top:-8px}
.err{color:var(--warn);font-size:16px;min-height:1px}
.hp{position:absolute;left:-9999px;height:0;width:0;opacity:0}
@media (max-width:760px){
  .wrap{padding:16px 16px 60px}.side{position:static}.q{padding:22px 18px 18px;border-radius:22px}
  button.sc{flex:1 1 100%;justify-content:flex-start;text-align:left;padding:12px 18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar" hidden>
    <div class="meta"><span id="crumb"></span><span id="count"></span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <main id="app"></main>
</div>
<script src="perguntas.js"></script>
<script>
(function(){
"use strict";
var CFG=window.GAEB_CONFIG, ESC=window.GAEB_ESCALAS, BLOCOS=window.GAEB_BLOCOS;
var app=document.getElementById('app'), bar=document.getElementById('bar');

// ---- achatar telas ----
var telas=[]; // {bloco, tema, sub, intro}
BLOCOS.forEach(function(b){
  var first=true;
  b.temas.forEach(function(t){
    t.subareas.forEach(function(s){
      telas.push({bloco:b,tema:t,sub:s,intro:first?b.intro:null});
      first=false;
    });
  });
});
var totalItens=0;
telas.forEach(function(t){t.sub.itens.forEach(function(it,i){it.id=t.sub.id+'-'+(i+1);totalItens++;});});

// ---- estado + salvamento local ----
var KEY='gaeb-levantamento-'+CFG.anoLevantamento;
var S={nome:'',passo:-1,ab:0,fe:0,r:{},c:{},o:{}}; // passo -1 abertura, 0..n-1 telas, n fim
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function carregar(){try{var x=localStorage.getItem(KEY);return x?JSON.parse(x):null;}catch(e){return null;}}
function limpar(){try{localStorage.removeItem(KEY);}catch(e){}}

// ---- helpers ----
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  for(var k in (attrs||{})){
    if(k==='class')e.className=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]===true)e.setAttribute(k,'');
    else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
var ultimoH=-100;
function novoGradiente(){
  var root=document.documentElement.style;
  var escuro=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  var h;do{h=Math.floor(Math.random()*360);}while(Math.abs(h-ultimoH)<60||Math.abs(h-ultimoH)>300);
  ultimoH=h;
  var passos=[0,Math.random()<.5?55:-55,Math.random()<.5?120:-120];
  var sat=escuro?'30%':'55%', luz=escuro?'42%':'84%', alfa=escuro?.38:.8;
  passos.forEach(function(p,i){
    root.setProperty('--g'+(i+1),'hsla('+((h+p+360)%360)+','+sat+','+luz+','+(alfa-i*.1)+')');
  });
  var pos=[[100,0],[0,65],[100,100]];
  pos.forEach(function(xy,i){
    var x=Math.max(0,Math.min(100,xy[0]+(Math.random()*40-20)));
    var y=Math.max(0,Math.min(100,xy[1]+(Math.random()*40-20)));
    root.setProperty('--x'+(i+1),x.toFixed(0)+'%');root.setProperty('--y'+(i+1),y.toFixed(0)+'%');
  });
}
var verificar=function(){};
function respondido(it){
  var r=S.r[it.id];
  if(it.t==='M'){if(!Array.isArray(r)||!r.length)return false;if(r.indexOf('Outra')>=0&&!(S.o[it.id]||'').trim())return false;return true;}
  if(!r)return false;
  if(r==='Outra'&&!(S.o[it.id]||'').trim())return false;
  return true;
}
function limparApp(){app.innerHTML='';window.scrollTo(0,0);novoGradiente();}
function dots(n,total){
  var d=el('div',{class:'dots','aria-label':'Passo '+(n+1)+' de '+total});
  for(var i=0;i<total;i++)d.appendChild(el('i',{class:i===n?'on':''}));
  return d;
}
function kick(t){return el('div',{class:'kick'},[t]);}
function versoBox(sec){
  var box=el('p',{class:'big verso'},[sec.verso]);
  box.appendChild(el('small',{},[sec.ref]));return box;
}
function barra(){
  var n=S.passo;
  if(n<0||n>=telas.length){bar.hidden=true;return;}
  bar.hidden=false;
  var t=telas[n];
  document.getElementById('crumb').textContent=t.bloco.titulo+' · '+t.tema.titulo;
  document.getElementById('count').textContent=(n+1)+' de '+telas.length;
  document.getElementById('fill').style.width=((n)/telas.length*100)+'%';
}

// ---- abertura (uma tela por parte) ----
function abertura(){
  S.passo=-1;barra();limparApp();
  var A=window.GAEB_ABERTURA, n=S.ab||0, total=A.secoes.length+1;
  var c=el('div',{class:'center'}), inn=el('div',{class:'in'});
  c.appendChild(dots(n,total));
  if(n===0){
    inn.appendChild(kick('Levantamento espiritual · GAEB'));
    inn.appendChild(el('h1',{},[A.titulo]));
    inn.appendChild(el('p',{class:'pausa'},[A.pausa]));
  }else{
    var sec=A.secoes[n-1];
    inn.appendChild(kick(n+' · '+sec.titulo));
    if(sec.verso)inn.appendChild(versoBox(sec));
    (sec.texto||[]).forEach(function(p,i){inn.appendChild(el('p',{class:(i===0&&!sec.verso)?'big':'note'},[p]));});
    if(sec.oracao)inn.appendChild(el('p',{class:'pausa'},[sec.oracao]));
  }
  c.appendChild(inn);
  var erro=el('div',{class:'err',role:'alert'}), nome=null;
  if(n===total-1){
    nome=el('input',{type:'text',id:'nome',autocomplete:'off',placeholder:'Como você se chama?',value:S.nome||''});
    c.appendChild(el('div',{class:'field'},[el('label',{for:'nome'},['Seu nome']),nome,
      el('div',{class:'small'},['Só os líderes que vão ler as respostas verão o seu nome.']),erro]));
  }
  var nav=el('div',{class:'nav'});
  if(n>0)nav.appendChild(el('button',{class:'btn ghost',onclick:function(){S.ab=n-1;salvar();abertura();}},['Voltar']));
  nav.appendChild(el('button',{class:'btn',onclick:function(){
    if(nome){
      var v=nome.value.trim();
      if(!v){erro.textContent='Escreva seu nome para começar.';nome.focus();return;}
      S.nome=v;S.passo=0;salvar();tela();return;
    }
    S.ab=n+1;salvar();abertura();
  }},[n===total-1?'Começar':'Continuar']));
  c.appendChild(nav);
  app.appendChild(c);
}

// ---- telas de perguntas ----
function tela(){
  var n=S.passo;
  if(n>=telas.length)return fim();
  barra();limparApp();
  var t=telas[n];
  var side=el('div',{class:'side'},[kick(t.bloco.titulo),el('h2',{},[t.sub.titulo])]);
  if(t.bloco.id!=='carater'||true)side.appendChild(el('p',{},['Responda como é, e não como acha que deveria ser.']));
  var qs=el('div',{class:'qs'});
  if(t.intro)qs.appendChild(el('div',{class:'intro'},[t.intro]));
  t.sub.itens.forEach(function(it){qs.appendChild(pergunta(it));});
  var proximo=el('button',{class:'btn',onclick:function(){if(proximo.disabled)return;S.passo=n+1;salvar();tela();}},[n===telas.length-1?'Concluir':'Continuar']);
  var aviso=el('div',{class:'small aviso',role:'status'});
  qs.appendChild(el('div',{class:'nav sp'},[
    el('button',{class:'btn ghost',onclick:function(){salvar();if(n===0){S.ab=3;abertura();}else{S.passo=n-1;tela();}}},['Voltar']),
    proximo
  ]));
  qs.appendChild(aviso);
  verificar=function(){
    var falta=t.sub.itens.filter(function(it){return !respondido(it);}).length;
    proximo.disabled=falta>0;
    aviso.textContent=falta>0?(falta===1?'Falta responder 1 pergunta para continuar.':'Faltam '+falta+' perguntas para continuar.'):'';
  };
  verificar();
  app.appendChild(el('div',{class:'split'},[side,qs]));
}
var TIPOS={F:'Com que frequência?',C:'O quanto você concorda?',S:'Escolha a que mais se parece com você',M:'Marque todas que combinam'};
function pergunta(it){
  var box=el('section',{class:'q'});
  var tag=TIPOS[it.t]; if(it.t==='M'&&it.max)tag='Marque até '+it.max;
  box.appendChild(el('div',{class:'tag'},[tag]));
  box.appendChild(el('p',{class:'t'},[it.q]));
  if(it.t==='F'||it.t==='C'){
    var g=el('div',{class:'scale'});
    ESC[it.t].forEach(function(lab){
      var b=el('button',{type:'button',class:'sc'+(S.r[it.id]===lab?' on':''),onclick:function(){
        S.r[it.id]=(S.r[it.id]===lab?undefined:lab);salvar();verificar();
        Array.prototype.forEach.call(g.children,function(x){x.classList.toggle('on',S.r[it.id]===x.textContent);});
      }},[lab]);
      g.appendChild(b);
    });
    box.appendChild(g);
  }else{
    var multi=it.t==='M';
    var lista=it.opcoes.slice(); if(it.outra!==false)lista.push('Outra');
    var cur=S.r[it.id]; if(multi&&!Array.isArray(cur))cur=[];
    var wrap=el('div',{class:'opts'});
    var outro=el('div',{class:'other'},[el('input',{type:'text',placeholder:'Outra: escreva aqui',value:S.o[it.id]||'',
      oninput:function(e){S.o[it.id]=e.target.value;salvar();verificar();}})]);
    function refresh(){
      var sel=S.r[it.id];
      var arr=multi?(sel||[]):(sel?[sel]:[]);
      Array.prototype.forEach.call(wrap.children,function(lb){
        var v=lb.getAttribute('data-v');
        var on=arr.indexOf(v)>=0;
        lb.classList.toggle('on',on);
        lb.querySelector('input').checked=on;
        var blocked=multi&&it.max&&!on&&arr.length>=it.max;
        lb.classList.toggle('dim',!!blocked);
        lb.querySelector('input').disabled=!!blocked;
      });
      outro.classList.toggle('show',arr.indexOf('Outra')>=0);
      verificar();
    }
    lista.forEach(function(op){
      var inp=el('input',{type:multi?'checkbox':'radio',name:it.id});
      var lb=el('label',{class:'o'+(multi?' m':''),'data-v':op},[inp,el('span',{class:'mk'}),el('span',{},[op==='Outra'?'Outra: ______':op])]);
      inp.addEventListener('change',function(){
        if(multi){
          var a=Array.isArray(S.r[it.id])?S.r[it.id].slice():[];
          var i=a.indexOf(op);
          if(i>=0)a.splice(i,1);else{if(it.max&&a.length>=it.max){refresh();return;}a.push(op);}
          S.r[it.id]=a;
        }else S.r[it.id]=op;
        salvar();refresh();
      });
      wrap.appendChild(lb);
    });
    box.appendChild(wrap);box.appendChild(outro);
    refresh();
  }
  // comentário opcional
  var ta=el('textarea',{placeholder:it.guia||'Escreva aqui, se quiser.',oninput:function(e){S.c[it.id]=e.target.value;salvar();}});
  ta.value=S.c[it.id]||'';
  var det=el('details',{class:'cm'},[el('summary',{},[it.guia?('Quer comentar? '+it.guia):'Quer comentar? (opcional)']),ta]);
  if(S.c[it.id])det.open=true;
  box.appendChild(det);
  return box;
}

// ---- fim e envio ----
function fim(){
  S.passo=telas.length;barra();limparApp();
  var E=window.GAEB_ENCERRAMENTO, n=S.fe||0, total=E.secoes.length;
  var c=el('div',{class:'center'}), inn=el('div',{class:'in'});
  c.appendChild(dots(n,total));
  var sec=E.secoes[n];
  if(n===0){
    inn.appendChild(kick('Levantamento espiritual · GAEB'));
    inn.appendChild(el('h1',{},[E.titulo]));
    inn.appendChild(el('p',{class:'pausa'},[E.pausa]));
  }
  inn.appendChild(kick((n+1)+' · '+sec.titulo));
  if(sec.texto)sec.texto.forEach(function(p,i){inn.appendChild(el('p',{class:(sec.verso&&i===0)?'pausa':'big'},[p]));});
  if(sec.verso)inn.appendChild(versoBox(sec));
  if(n===total-1)inn.appendChild(el('p',{class:'big',style:'color:var(--accent)'},[E.agradecimento]));
  c.appendChild(inn);
  var hp=el('input',{type:'text',class:'hp',tabindex:'-1',autocomplete:'off','aria-hidden':'true',id:'hp'});
  c.appendChild(hp);
  var msg=el('div',{class:'err',role:'alert'});
  var nav=el('div',{class:'nav'});
  if(n===0)nav.appendChild(el('button',{class:'btn ghost',onclick:function(){S.passo=telas.length-1;salvar();tela();}},['Voltar']));
  else nav.appendChild(el('button',{class:'btn ghost',onclick:function(){S.fe=n-1;salvar();fim();}},['Voltar']));
  var btn=el('button',{class:'btn',onclick:function(){
    if(n<total-1){S.fe=n+1;salvar();fim();}else enviar();
  }},[n<total-1?'Continuar':'Enviar minhas respostas']);
  nav.appendChild(btn);c.appendChild(nav);c.appendChild(msg);
  if(n===total-1)c.appendChild(el('p',{class:'small'},['Se a conexão falhar, nada se perde: é só tentar de novo.']));
  app.appendChild(c);

  function enviar(){
    if(hp.value){return;}
    if(!CFG.formspree||CFG.formspree.indexOf('COLE_AQUI')===0){msg.textContent='A página ainda não foi ligada ao envio. Avise um dos líderes.';return;}
    btn.disabled=true;btn.textContent='Enviando…';msg.textContent='';
    var corpo={nome:S.nome,_subject:CFG.assunto+' — '+S.nome,respostas:texto(),enviado_em:new Date().toISOString()};
    fetch(CFG.formspree,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(corpo)})
      .then(function(r){if(!r.ok)throw new Error('http '+r.status);limpar();obrigado();})
      .catch(function(){btn.disabled=false;btn.textContent='Tentar enviar de novo';msg.textContent='Não consegui enviar agora. Suas respostas estão guardadas neste aparelho. Confira a internet e tente de novo.';});
  }
}
function texto(){
  var L=[],n=0;
  telas.forEach(function(t){
    L.push('','=== '+t.bloco.titulo+' · '+t.tema.titulo+' · '+t.sub.titulo+' ===');
    t.sub.itens.forEach(function(it){
      n++;
      var r=S.r[it.id],resp;
      if(Array.isArray(r))resp=r.length?r.map(function(x){return x==='Outra'?'Outra: '+(S.o[it.id]||'(sem texto)'):x;}).join(' | '):'(sem resposta)';
      else if(r)resp=(r==='Outra')?'Outra: '+(S.o[it.id]||'(sem texto)'):r;
      else resp='(sem resposta)';
      L.push('');
      L.push(String(n).padStart(2,'0')+' ['+it.t+'] '+it.q);
      L.push('   → '+resp);
      if(S.c[it.id]&&S.c[it.id].trim())L.push('   Comentário: '+S.c[it.id].trim());
    });
  });
  return L.join('\n');
}
function obrigado(){
  bar.hidden=true;limparApp();
  app.appendChild(el('div',{class:'center'},[
    el('h1',{},['Enviado. Obrigado!']),
    el('p',{class:'pausa'},['Suas respostas chegaram aos líderes. Deus já conhecia cada uma delas, e o amor dele por você não mudou.']),
    el('p',{class:'small'},['Pode fechar esta página. Se este for um aparelho compartilhado, nada fica guardado aqui.'])
  ]));
}

// ---- início: retomar? ----
var salvo=carregar();
if(salvo&&salvo.nome&&(salvo.passo>=0)){
  S=salvo;
  limparApp();
  app.appendChild(el('div',{class:'center'},[
    el('h1',{},['Olá, '+S.nome]),
    el('p',{class:'pausa'},['Você já começou o levantamento neste aparelho. Quer continuar de onde parou?']),
    el('div',{class:'nav'},[
      el('button',{class:'btn ghost',onclick:function(){if(confirm('Apagar o que foi respondido e começar do zero?')){limpar();S={nome:'',passo:-1,ab:0,fe:0,r:{},c:{},o:{}};abertura();}}},['Começar de novo']),
      el('button',{class:'btn',onclick:function(){S.passo>=telas.length?fim():tela();}},['Continuar'])
    ])
  ]));
}else abertura();
})();
</script>
</body>
</html>
